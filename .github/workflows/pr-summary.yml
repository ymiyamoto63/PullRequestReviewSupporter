name: PR Summary

# PR が作成・更新されるたびに、内容をまとめた HTML を生成して gh-pages ブランチへ公開する。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]

permissions:
  contents: write        # gh-pages ブランチへの push
  pull-requests: write   # PR へのリンクコメント

# gh-pages への push が競合しないよう、リポジトリ全体で直列に実行する
concurrency:
  group: pr-summary-gh-pages
  cancel-in-progress: false

jobs:
  summary:
    # フォークからの PR ではトークンが読み取り専用のため実行しない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add site origin/gh-pages
            git -C site checkout -B gh-pages
          else
            git worktree add --detach site
            git -C site checkout --orphan gh-pages
            git -C site rm -rf --quiet .
          fi
          touch site/.nojekyll

      # 変更内容の要約に GitHub Copilot CLI を使う。Secret が未設定ならスキップし、ルールによる観点だけを出力する
      - name: Install Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        if: env.COPILOT_GITHUB_TOKEN != ''
        run: npm install -g @github/copilot

      - name: Generate summary HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PR_SUMMARY_MODEL: ${{ vars.PR_SUMMARY_MODEL }}
        run: python3 scripts/generate_pr_summary.py --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --out site

      - name: Publish to gh-pages
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Update summary for PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          fi

      - name: Comment summary link on PR
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-summary-link -->';
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const url = `https://${owner.toLowerCase()}.github.io/${repo}/pr/${number}/`;
            const body = `${marker}\n📄 レビュー用サマリー: ${url}\n\n(PR が更新されるたびに自動で再生成されます。反映まで1〜2分かかることがあります。)`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
