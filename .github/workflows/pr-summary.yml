name: PR Summary

# PR が作成・更新されるたびに、内容をまとめた HTML を生成して gh-pages ブランチへ公開する。
# このリポジトリ自身では、PR に含まれる action.yml をそのまま使って動作を確かめる。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, closed]

permissions:
  contents: write        # gh-pages ブランチへの push
  pull-requests: write   # PR へのリンクコメント
  pages: read            # 公開 URL の取得

# gh-pages への push が競合しないよう、リポジトリ全体で直列に実行する
concurrency:
  group: pr-summary-gh-pages
  cancel-in-progress: false

jobs:
  summary:
    # フォークからの PR ではトークンが読み取り専用のため実行しない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          model: ${{ vars.PR_SUMMARY_MODEL }}
